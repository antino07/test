<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Filters</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load the AI Face Tracking Library directly from the web -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script defer src="script.js"></script>
</head>
<body>

    <h2>AI Face Filters</h2>
    <p id="loading-text">Loading AI Models... please wait!</p>
    
    <div class="video-container">
        <!-- playsinline is required so iPhones don't force fullscreen -->
        <video id="camera-stream" autoplay playsinline muted></video>
        <!-- The canvas sits on top of the video to draw the filters -->
        <canvas id="filter-canvas"></canvas>
    </div>
    
    <div class="controls">
        <select id="filter-select" disabled>
            <option value="none">No Filter</option>
            <option value="love">💖 Love Stuck</option>
            <option value="dizzy">🐦 Dizzy Birds</option>
            <option value="twirl">🌀 Twirl (Spirals)</option>
        </select>
        <button id="capture-btn" disabled>📸 Snap Photo</button>
    </div>

</body>
</html>
