<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Camera with Filters</title>
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <h2>Filter Camera</h2>
    
    <!-- Live Preview -->
    <video id="camera-stream" autoplay playsinline></video>
    
    <div class="controls">
        <!-- Filter Selection Dropdown -->
        <select id="filter-select">
            <option value="none">No Filter</option>
            <option value="grayscale(100%)">Grayscale</option>
            <option value="sepia(100%)">Sepia</option>
            <option value="invert(100%)">Invert</option>
            <option value="blur(4px)">Blur</option>
            <option value="contrast(150%)">High Contrast</option>
            <option value="hue-rotate(90deg)">Alien (Hue Rotate)</option>
        </select>

        <button id="capture-btn">📸 Snap & Download</button>
    </div>

    <!-- Hidden Canvas used for processing the final image -->
    <canvas id="photo-canvas"></canvas>

    <!-- Link to your JavaScript file (always at the bottom of the body) -->
    <script src="script.js"></script> 
</body>
</html>
