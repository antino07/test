<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Web Camera</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            background-color: #222; /* Dark background looks better for cameras */
            color: white;
            margin-top: 50px;
        }
        video {
            width: 100%;
            max-width: 500px; /* Slightly wider for desktop webcams */
            border: 4px solid #555;
            border-radius: 8px;
            background: #000;
        }
        button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        canvas { display: none; } /* Hidden, used for processing */
    </style>
</head>
<body>

    <h2>Take a Photo</h2>
    
    <!-- playsinline is critical so iPhones don't force the video into fullscreen media player mode -->
    <video id="camera-stream" autoplay playsinline></video>
    
    <button id="capture-btn">📸 Snap & Download</button>

    <canvas id="photo-canvas"></canvas>

    <script>
        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('photo-canvas');
        const context = canvas.getContext('2d');
        const captureBtn = document.getElementById('capture-btn');

        // The Universal Settings
        const constraints = {
            video: {
                // 'ideal' means: prefer the back camera if available, 
                // but fall back to the default webcam if it's a desktop.
                facingMode: { ideal: "environment" } 
            }
        };

        // Start the camera
        navigator.mediaDevices.getUserMedia(constraints)
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Camera access denied or error:", err);
                alert("Could not access the camera. Please ensure you have granted permission.");
            });

        // Capture and Download
        captureBtn.addEventListener('click', () => {
            // Ensure the video is actually playing before taking a photo
            if (video.videoWidth === 0 || video.videoHeight === 0) return;

            // Set canvas size to match the camera's resolution
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Draw the picture
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Create the image file
            const imageDataURL = canvas.toDataURL('image/png');

            // Force download to device (Downloads folder on desktop, Files/Photos on mobile)
            const downloadLink = document.createElement('a');
            downloadLink.href = imageDataURL;
            downloadLink.download = `Snapshot_${new Date().getTime()}.png`; 
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        });
    </script>
</body>
</html>
